schema_version: 1
usage: |
  {{< card-grid variant="feature" >}}
  {{< card title="使い方を学ぶ" icon="book" >}}
  はじめて使う方のためのガイドです。
  {{< /card >}}
  {{< card title="設定を確認" icon="settings" >}}
  自分に合った設定を見つけましょう。
  {{< /card >}}
  {{< card title="作業のヒント" icon="tips" wide=true >}}
  `wide=true` のカードは、グリッドの全列幅で表示できます。
  {{< /card >}}
  {{< /card-grid >}}
snippet: |
  {{< card-grid variant="default" >}}
  {{< card title="1つ目のカード" icon="book" >}}
  ここに説明を Markdown で書きます。
  {{< /card >}}
  {{< card title="2つ目のカード" icon="tips" >}}
  ここに説明を Markdown で書きます。
  {{< /card >}}
  {{< /card-grid >}}
