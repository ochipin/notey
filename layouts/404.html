{{ define "main" }}
  <article class="doc doc--center">
    <p class="err-code">404</p>
    <h1 class="doc-title">{{ i18n "error.404_title" }}</h1>
    <p class="doc-lead">{{ i18n "error.404_description" }}</p>
    <p class="doc-cta">
      <a class="btn" href="{{ site.Home.RelPermalink }}">{{ i18n "ui.home" }}</a>
      <button class="btn btn--ghost" data-search-open>{{ i18n "ui.search" }}</button>
    </p>
    {{ partial "footer.html" . }}
  </article>
{{ end }}
