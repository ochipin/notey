<dialog id="search-dialog" class="sdlg" aria-label="{{ i18n "ui.search" }}">
  <div class="sdlg-box">
    <div class="sdlg-head">
      <span class="icon icon-search" aria-hidden="true"></span>
      <input id="search-input" class="sdlg-input" type="search" autocomplete="off" spellcheck="false" aria-label="{{ i18n "ui.search_placeholder" }}" aria-controls="search-results" placeholder="{{ i18n "ui.search_placeholder" }}">
      <button class="sdlg-close" data-search-close aria-label="{{ i18n "ui.close" }}"><kbd>Esc</kbd></button>
    </div>
    <p id="search-summary" class="sdlg-summary" role="status" aria-atomic="true" hidden></p>
    <div class="sdlg-body">
      <p id="search-status" class="sdlg-status" role="status">{{ i18n "ui.search_hint" }}</p>
      <ol id="search-results" class="sdlg-results"></ol>
      <button id="search-more" class="sdlg-more" hidden>{{ i18n "ui.load_more" }}</button>
    </div>
    <div class="sdlg-foot">
      <span class="sdlg-keyhint"><kbd>↑</kbd><kbd>↓</kbd> {{ i18n "ui.kbd_move" }}</span>
      <span class="sdlg-keyhint"><kbd>Enter</kbd> {{ i18n "ui.kbd_open" }}</span>
      <span class="sdlg-powered">Pagefind</span>
      <button type="button" class="sdlg-credit" data-credits-open aria-haspopup="dialog" aria-controls="credits-dialog">{{ i18n "ui.credits" }}</button>
    </div>
  </div>
</dialog>
