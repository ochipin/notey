{{- $primary := eq (printf "%v" (.Get "primary")) "true" -}}
{{- $arrow := eq (printf "%v" (.Get "arrow")) "true" -}}
<a class="btn{{ if not $primary }} btn--ghost{{ end }}" href="{{ partial "page-url.html" (dict "page" .Page "href" (.Get "href")) }}">{{ .Inner | strings.TrimSpace }}{{ if $arrow }}<span class="icon icon-arrow-right" aria-hidden="true"></span>{{ end }}</a>
