baseURL = 'https://example.org/'
languageCode = 'en-US'
title = 'Notey'
name = 'Notey'
license = 'MIT'
licenselink = 'https://github.com/ochipin/notey/blob/main/LICENSE'
description = 'A lightweight, documentation-oriented Hugo theme.'
homepage = 'https://github.com/ochipin/notey'
tags = ['documentation', 'responsive', 'multilingual']
features = ['documentation navigation', 'search', 'shortcodes']
min_version = '0.146.0'

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

[module]
  [module.hugoVersion]
    extended = false
    min = '0.146.0'
